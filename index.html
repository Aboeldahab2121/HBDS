<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
:root{
  --bg:linear-gradient(160deg,#fff3e0 0%,#ffe1ea 58%,#efe6ff 100%);
  --card:rgba(255,255,255,.84); --ink:#3a2630; --muted:#7a6670; --line:rgba(58,38,48,.14);
  --accent:#c2456b; --accent-ink:#fff; --soft:rgba(194,69,107,.09);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:linear-gradient(160deg,#2a1b25 0%,#321e2c 60%,#261f36 100%);
    --card:rgba(255,255,255,.07); --ink:#f6e9ee; --muted:#c9b3bd; --line:rgba(255,255,255,.16);
    --accent:#f08aa8; --accent-ink:#2a1b25; --soft:rgba(240,138,168,.14);
  }
}
:root[data-theme="dark"]{
  --bg:linear-gradient(160deg,#2a1b25 0%,#321e2c 60%,#261f36 100%);
  --card:rgba(255,255,255,.07); --ink:#f6e9ee; --muted:#c9b3bd; --line:rgba(255,255,255,.16);
  --accent:#f08aa8; --accent-ink:#2a1b25; --soft:rgba(240,138,168,.14);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);background-attachment:fixed;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.6}
main{max-width:600px;margin:0 auto;padding:28px 18px 48px}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:500;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
h1{font-size:clamp(32px,8vw,44px)} h2{font-size:clamp(26px,6.5vw,32px)}
p{margin:0 0 14px}
.muted{color:var(--muted)} .small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:0 8px 30px rgba(60,30,50,.08);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gate{text-align:center;margin-top:12vh}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
input,textarea,button{font:inherit;color:inherit}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .field{background:rgba(255,255,255,.06)}}
:root[data-theme="dark"] .field{background:rgba(255,255,255,.06)}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.field{min-height:84px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 22px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--accent);min-height:22px;font-size:14px;margin-top:10px}
/* steps bar */
.bar{margin-bottom:18px}
.bar .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;text-align:center}
.seg{display:flex;gap:8px}
.seg i{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--muted);transition:background .3s,color .3s}
.seg i.done{background:var(--soft);color:var(--ink)}
.seg i.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* letter */
.letter p{font-size:18px;line-height:1.75}
.sign{font-family:'Fraunces',Georgia,serif;font-size:20px;margin-top:20px}
/* music */
.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.track{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.track:first-of-type{border-top:0}
.glyph{width:42px;height:42px;border-radius:10px;background:var(--soft);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:10px 0;flex:none}
.glyph b{width:3px;background:var(--accent);border-radius:2px}
.track .t{flex:1;min-width:0}
.track .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .a{font-size:14px;color:var(--muted)}
.track a{font-size:14px;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:999px;flex:none}
.track a:hover{background:var(--soft)}
/* notes */
.note{padding:14px 16px;border-radius:14px;background:var(--soft);margin-bottom:10px}
.note b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:18px;margin-bottom:2px}
/* gallery */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.fl{border-radius:16px;padding:10px 6px 12px;text-align:center}
.fl svg{width:100%;height:auto;max-height:200px;display:block}
.fl span{font-size:13px;color:#5a4650}
.wish{text-align:center;padding-top:6px}
/* form */
.q{margin:20px 0 0}
.q>label,.q>.ql{display:block;font-weight:600;margin-bottom:8px}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 16px;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<main>
  <div id="bar"></div>
  <div id="app"></div>
</main>

<script>
// ===== Edit these =====
var PASSWORD = "sandosa";                  // not case sensitive
var HINT     = "Hint: it’s the nickname I always loved calling you!";
var HER      = "Sondos";
var ME       = "Mostafa";

var LETTER = [
  "Haaayyyyy Sandosa,",
  "I’m not great at this stuff, so I’ll just say it the way I’d say it out loud.",
  "Happy birthday. I mean that in the simple, no-hidden-agenda way. You’re one of those people who makes things feel lighter without trying, and I’m lucky I got to see that up close.",
  "Every time I got a new phone, you were always one of the first photos I took with its camera. I never really questioned that. It just felt right.",
  "And honestly, some of my favorite moments were the quiet ones: sitting together, watching the sea do what it does. Nothing to say, nothing to prove, just peace. Whatever happened after, none of that gets erased, and I’m really grateful for it.",
  "I hope this year is gentle with you. I hope you get slow mornings, food you love, people who make you laugh, and the things you’ve been working toward actually show up.",
  "Also, I’m really proud of you for the gym. Showing up for yourself like that isn’t easy, and you keep doing it anyway.",
  "There’s no pressure on anything in here, by the way. Read it, skip it, take what you like. I just wanted you to know I’m thinking of you today, and that I’m rooting for you.",
];
var SIGN = "Always on your side,\n" + ME;

// Spotify: add "url" (a track/artist link) for an exact link, otherwise it opens a Spotify search.
var MUSIC = [
  { title:"Songs we shared", list:[
    { t:"The Phoenix", a:"Fall Out Boy" },
    { t:"Earned It", a:"The Weeknd" } ]},
  { title:"The artist we always agreed on", list:[
    { t:"The Weeknd", a:"Our shared favorite", url:"https://open.spotify.com/search/The%20Weeknd" },
    { t:"Blinding Lights", a:"The Weeknd" } ]},
  { title:"Songs that remind me of you", list:[
    { t:"505", a:"Arctic Monkeys" } ]},
];

var NOTES = [
  ["Drink some water.", "Cappuccino number four doesn’t count as hydration."],
  ["Eat a proper meal.", "Coffee and a biscuit isn’t lunch."],
  ["Rest days count as training.", "I’m so proud of how you show up at the gym. Muscles grow while you recover, so a day off is part of the plan."],
  ["Rest is allowed.", "You don’t have to earn a break."],
  ["Be as kind to yourself as you are to everyone else.", "You’d never talk to a friend the way you sometimes talk to you."],
  ["Say no without a long explanation.", "A short no is still a full sentence."],
  ["Go outside for ten minutes.", "Sun, air, no phone. It helps more than it should."],
];
// ======================

var app = document.getElementById("app"), barEl = document.getElementById("bar");
var step = -1, TOTAL = 5, meet = { part:"", date:"", time:"", things:[], vibe:3, note:"" };

function bar(){
  if(step<0){ barEl.innerHTML=""; return; }
  var h='<div class="bar"><div class="label">Secret steps</div><div class="seg">';
  for(var k=0;k<TOTAL;k++) h+='<i class="'+(k<step?'done':k===step?'now':'')+'">'+(k+1)+'</i>';
  barEl.innerHTML=h+'</div></div>';
}
function nav(first,last){
  return '<div class="nav">'+(first?'<span></span>':'<button class="link" data-a="back">Back</button>')+
    (last?'<span></span>':'<button class="btn" data-a="next">Continue</button>')+'</div>';
}

/* ---------- flowers (inline SVG) ---------- */
function ring(n,rx,ry,d,fill,cx,cy,st){var o="";for(var k=0;k<n;k++){o+='<ellipse cx="'+cx+'" cy="'+(cy-d)+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" stroke="'+(st||"none")+'" stroke-width="1" transform="rotate('+(360/n*k)+' '+cx+' '+cy+')"/>';}return o;}
function flower(type){
  var s='<svg viewBox="0 0 200 250" role="img" aria-label="'+type+'">'+
   '<path d="M100 125C97 165 104 205 100 246" stroke="#6f9a6b" stroke-width="5" fill="none" stroke-linecap="round"/>'+
   '<ellipse cx="78" cy="195" rx="22" ry="8" fill="#86b383" transform="rotate(-30 78 195)"/>'+
   '<ellipse cx="124" cy="212" rx="22" ry="8" fill="#78a875" transform="rotate(30 124 212)"/>';
  if(type==="Daisy") s+=ring(14,7,25,27,"#fffaf2",100,100,"#eadfd2")+'<circle cx="100" cy="100" r="14" fill="#f2bd3b"/>';
  if(type==="Sunflower") s+=ring(18,7,20,30,"#f4b53a",100,100)+ring(18,6,16,24,"#f8cb5c",100,100)+'<circle cx="100" cy="100" r="20" fill="#7a4a2b"/>';
  if(type==="Poppy") s+=ring(7,19,24,22,"#ee8aa7",100,100,"#e1708f")+'<circle cx="100" cy="100" r="8" fill="#6d2a49"/>';
  if(type==="Tulip") s+='<path d="M70 58C64 104 78 134 100 136C122 134 136 104 130 58C119 78 108 74 100 52C92 74 81 78 70 58Z" fill="#e8628a"/><path d="M100 52C88 80 88 114 100 134C112 114 112 80 100 52Z" fill="#f08aa8"/>';
  if(type==="Rose") s+='<circle cx="100" cy="98" r="40" fill="#d6456b"/><circle cx="100" cy="98" r="30" fill="#df5a7e" stroke="#b8335a" stroke-width="2"/><circle cx="100" cy="98" r="20" fill="#e8708f" stroke="#b8335a" stroke-width="2"/><circle cx="100" cy="98" r="10" fill="#d6456b" stroke="#b8335a" stroke-width="2"/>';
  if(type==="Lavender"){ for(var k=0;k<9;k++){var y=45+k*11,x=k%2?91:109; s+='<ellipse cx="'+x+'" cy="'+y+'" rx="9" ry="5" fill="#9a86d6" transform="rotate('+(k%2?-25:25)+' '+x+' '+y+')"/>';} s+='<ellipse cx="100" cy="36" rx="5" ry="9" fill="#a996e0"/>'; }
  return s+'</svg>';
}
var BLOOMS=[["Daisy","for easy mornings","#fff0dc"],["Tulip","for good news","#ffe3ec"],["Sunflower","for bright days","#fff2c9"],["Rose","just because","#ffdfe6"],["Lavender","for slow evenings","#ece4fa"],["Poppy","for a bold year","#ffe6e0"]];

/* ---------- views ---------- */
function gate(){
  app.innerHTML='<div class="card gate"><div class="eyebrow">A little something</div><h1>For '+HER+'</h1>'+
  '<p class="muted">There’s something inside. Enter the secret password to open it.</p>'+
  '<form id="gf"><input class="field" id="pw" type="password" placeholder="Password" autocomplete="off" aria-label="Password"><div class="err" id="err"></div>'+
  '<button class="btn" type="submit" style="margin-top:6px">Open</button></form></div>';
  var tries=0;
  document.getElementById("gf").onsubmit=function(e){
    e.preventDefault();
    var v=document.getElementById("pw").value.trim().toLowerCase();
    if(v===PASSWORD.toLowerCase()){ step=0; render(); }
    else{ tries++; document.getElementById("err").textContent= tries>1 ? HINT : "Hmm, that’s not it. Try again."; }
  };
  document.getElementById("pw").focus();
}

function viewLetter(){
  var h='<div class="card letter"><div class="eyebrow">A letter</div><h2>Happy birthday</h2>';
  LETTER.forEach(function(p){ h+='<p>'+p+'</p>'; });
  return h+'<div class="sign">'+SIGN.replace(/\n/g,"<br>")+'</div>'+nav(true)+'</div>';
}
function viewMusic(){
  var h='<div class="card"><div class="eyebrow">Music</div><h2>A few songs</h2><p class="muted">Tap Play to open any of them in Spotify.</p>';
  MUSIC.forEach(function(g){
    h+='<div class="sec">'+g.title+'</div>';
    g.list.forEach(function(s){
      var u=s.url||("https://open.spotify.com/search/"+encodeURIComponent(s.t+" "+s.a));
      h+='<div class="track"><div class="glyph"><b style="height:40%"></b><b style="height:80%"></b><b style="height:55%"></b><b style="height:100%"></b><b style="height:35%"></b></div>'+
         '<div class="t"><div>'+s.t+'</div><div class="a">'+s.a+'</div></div><a href="'+u+'" target="_blank" rel="noopener">Play</a></div>';
    });
  });
  return h+nav()+'</div>';
}
function viewNotes(){
  var h='<div class="card"><div class="eyebrow">Notes</div><h2>Small reminders</h2><p class="muted">For the days you forget to look after yourself.</p>';
  NOTES.forEach(function(n){ h+='<div class="note"><b>'+n[0]+'</b>'+n[1]+'</div>'; });
  return h+nav()+'</div>';
}
function viewGallery(){
  var h='<div class="card"><div class="eyebrow">Flowers</div><h2>These are for you</h2><div class="grid">';
  BLOOMS.forEach(function(b){ h+='<div class="fl" style="background:'+b[2]+'">'+flower(b[0])+'<span>'+b[0]+", "+b[1]+'</span></div>'; });
  return h+'</div><div class="wish"><p>Wishing you a very delightful and happy birthday, '+HER+'. May the year ahead be soft, bright and full of good news.</p></div>'+nav()+'</div>';
}
function viewMeet(){
  var things=["A hot Spanish latte","Dinner","Dessert","A walk by the sea","A movie","Something else"];
  var h='<div class="card"><div class="eyebrow">One last thing</div><h2>A little meet-up?</h2>'+
  '<p class="muted">Totally optional. If you feel like catching up, build it your way and send it over.</p>'+
  '<div class="q"><span class="ql">Daytime or evening?</span><div class="two"><button class="pill'+(meet.part==="Daytime"?' on':'')+'" data-part="Daytime">Daytime</button><button class="pill'+(meet.part==="Evening"?' on':'')+'" data-part="Evening">Evening</button></div></div>'+
  '<div class="q"><label for="d">Which day suits you?</label><input class="field" id="d" type="date" value="'+meet.date+'"></div>'+
  '<div class="q"><label for="tm">Around what time?</label><input class="field" id="tm" type="time" value="'+meet.time+'"></div>'+
  '<div class="q"><span class="ql">What sounds good? (pick any)</span><div class="row">';
  things.forEach(function(t){ h+='<button class="pill'+(meet.things.indexOf(t)>-1?' on':'')+'" data-thing="'+t+'">'+t+'</button>'; });
  h+='</div></div><div class="q"><label for="v">How laid-back?</label><input id="v" type="range" min="1" max="5" value="'+meet.vibe+'"><div class="scale"><span>Super casual</span><span>A bit dressed up</span></div></div>'+
  '<div class="q"><label for="n">Any suggestions?</label><textarea class="field" id="n" placeholder="A hot Spanish latte (never iced), right? Add anything else: a place you love, a time that works, a cake preference...">'+meet.note+'</textarea></div>'+
  '<div class="row" style="margin-top:22px"><button class="btn" data-a="wa">Email my picks</button><button class="btn line" data-a="cp">Copy</button></div>'+
  '<div class="err" id="merr"></div><div id="decl"></div>'+
  '<div class="nav"><button class="link" data-a="back">Back</button><button class="link" data-a="no">Maybe another time</button></div></div>';
  return h;
}
var VIEWS=[viewLetter,viewMusic,viewNotes,viewGallery,viewMeet];

function render(){
  if(step<0){ bar(); gate(); return; }
  bar(); app.innerHTML=VIEWS[step](); window.scrollTo(0,0);
  if(step===4){ var d=document.getElementById("d"); var t=new Date(); d.min=t.getFullYear()+"-"+("0"+(t.getMonth()+1)).slice(-2)+"-"+("0"+t.getDate()).slice(-2); }
}
function grab(){
  var d=document.getElementById("d"); if(!d) return;
  meet.date=d.value; meet.time=document.getElementById("tm").value; meet.vibe=+document.getElementById("v").value; meet.note=document.getElementById("n").value.trim();
}
var VIBES=["Super casual","Casual","Relaxed","A little nicer","Dressed up"];
function summary(){
  var ds=meet.date?new Date(meet.date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}):"open";
  var t="Hi "+ME+"! Thank you for the birthday surprise. Here’s my pick for a little meet-up:\n";
  t+="• When: "+(meet.part||"either works")+", "+ds+(meet.time?" around "+meet.time:"")+"\n";
  t+="• What: "+(meet.things.length?meet.things.join(", "):"surprise me")+"\n";
  t+="• Vibe: "+VIBES[meet.vibe-1]+"\n";
  if(meet.note) t+="• Note: "+meet.note+"\n";
  return t;
}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},1800);}

app.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var a=b.dataset.a;
  if(a==="next"){ grab(); step++; render(); }
  else if(a==="back"){ grab(); step--; render(); }
  else if(b.dataset.part){ grab(); meet.part=b.dataset.part; var s=window.scrollY; render(); window.scrollTo(0,s); }
  else if(b.dataset.thing){ grab(); var i=meet.things.indexOf(b.dataset.thing); if(i>-1) meet.things.splice(i,1); else meet.things.push(b.dataset.thing); var s2=window.scrollY; render(); window.scrollTo(0,s2); }
  else if(a==="wa"||a==="cp"){
    grab();
    if(!meet.date){ document.getElementById("merr").textContent="Pick a day first, even a rough one."; return; }
    document.getElementById("merr").textContent="";
    if(a==="wa"){ var m=document.createElement("a"); m.href="mailto:mostafaaboeldahab20@gmail.com?subject="+encodeURIComponent("Sondos’s picks for our meet-up")+"&body="+encodeURIComponent(summary()); document.body.appendChild(m); m.click(); m.remove(); setTimeout(function(){ var e2=document.getElementById("merr"); if(e2&&document.visibilityState==="visible") e2.textContent="If your mail app didn’t open, tap Copy and send it to me instead."; },1500); }
    else { try{ navigator.clipboard.writeText(summary()).then(function(){toast("Copied")},function(){toast("Couldn’t copy, a screenshot works too")}); }catch(x){ toast("Couldn’t copy, a screenshot works too"); } }
  }
  else if(a==="no"){ document.getElementById("decl").innerHTML='<p class="muted" style="margin-top:14px">That’s completely fine. Happy birthday, again, and I hope today is a really good one.</p>'; }
});

render();
</script>
</body>
</html>
